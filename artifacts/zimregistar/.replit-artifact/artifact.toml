kind = "web"
previewPath = "/"
title = "ZimRegistrar Dashboard"
version = "1.0.0"
id = "artifacts/zimregistar"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25106

[services.development]
run = "pnpm --filter @workspace/zimregistar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zimregistar", "run", "build" ]
serve = "static"
publicDir = "artifacts/zimregistar/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25106"
BASE_PATH = "/"
